AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Parameters:
  MongoDBUri:
    Type: String
    Description: MongoDB Connection String
  JwtSecret:
    Type: String
    Description: Secret for JWT signing
  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID
  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Tracing: Active
Resources:
  TaskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - Content-Type
        - Authorization
        AllowMethods:
        - GET
        - POST
        - PATCH
        - DELETE
        - OPTIONS
  TaskFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
      SamResourceId: TaskFunction
    Properties:
      CodeUri: TaskFunction
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
      - arm64
      Environment:
        Variables:
          MONGODB_URI:
            Ref: MongoDBUri
          MONGODB_DATABASE: taskdb
          JWT_SECRET:
            Ref: JwtSecret
          GOOGLE_CLIENT_ID:
            Ref: GoogleClientId
          GOOGLE_CLIENT_SECRET:
            Ref: GoogleClientSecret
      Events:
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TaskApi
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: TaskApi
            Path: /{proxy+}
            Method: ANY
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${TaskApi}.execute-api.${AWS::Region}.amazonaws.com
